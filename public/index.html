<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff">
<title>SuvShare</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='5' fill='%231a1d21'/><path d='M7 15.5h10M12 6v7.5M8.5 10.5 12 14l3.5-3.5' stroke='white' stroke-width='1.8' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
</head>
<body>

<svg class="sprite" aria-hidden="true">
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4.1a1.5 1.5 0 0 1 1.2.6l.9 1.2a1.5 1.5 0 0 0 1.2.6h6.6A1.5 1.5 0 0 1 20 9.9v7.6a1.5 1.5 0 0 1-1.5 1.5h-14A1.5 1.5 0 0 1 3 17.5z"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M13 3H7a1.5 1.5 0 0 0-1.5 1.5v15A1.5 1.5 0 0 0 7 21h10a1.5 1.5 0 0 0 1.5-1.5V8.5z"/><path d="M13 3v4.5a1 1 0 0 0 1 1h4.5"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m5 17 4.2-4.2a1.5 1.5 0 0 1 2.1 0L15 16.5m0 0 1.6-1.6a1.5 1.5 0 0 1 2.1 0L20 16"/></symbol>
  <symbol id="i-video" viewBox="0 0 24 24"><rect x="3" y="5.5" width="13" height="13" rx="2"/><path d="m16 11.5 4.2-2.6a.6.6 0 0 1 .9.5v5.2a.6.6 0 0 1-.9.5L16 12.5z"/></symbol>
  <symbol id="i-audio" viewBox="0 0 24 24"><path d="M9 17.5V6.2l9-1.7v11"/><circle cx="6.8" cy="17.6" r="2.4"/><circle cx="15.8" cy="15.6" r="2.4"/></symbol>
  <symbol id="i-doc" viewBox="0 0 24 24"><path d="M13 3H7a1.5 1.5 0 0 0-1.5 1.5v15A1.5 1.5 0 0 0 7 21h10a1.5 1.5 0 0 0 1.5-1.5V8.5z"/><path d="M13 3v4.5a1 1 0 0 0 1 1h4.5M8.5 13h7M8.5 16.5h4.5"/></symbol>
  <symbol id="i-archive" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="5" rx="1.5"/><path d="M5 9.5v8.5A1.5 1.5 0 0 0 6.5 19.5h11a1.5 1.5 0 0 0 1.5-1.5V9.5M10.5 13.5h3"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 4.5 4.5"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4.5M7.5 9 12 4.5 16.5 9M4.5 15v3A1.5 1.5 0 0 0 6 19.5h12a1.5 1.5 0 0 0 1.5-1.5v-3"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M4 6.5h16M4 12h16M4 17.5h16"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="12" cy="5.5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="18.5" r="1.4"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4.5v11M7.5 11 12 15.5 16.5 11M4.5 19.5h15"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13.8a3.6 3.6 0 0 0 5.1 0l2.6-2.6a3.6 3.6 0 0 0-5.1-5.1l-1.2 1.2"/><path d="M14 10.2a3.6 3.6 0 0 0-5.1 0l-2.6 2.6a3.6 3.6 0 1 0 5.1 5.1l1.2-1.2"/></symbol>
  <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4.5 19.5h3l9.3-9.3a2.1 2.1 0 0 0-3-3L4.5 16.5z"/><path d="m14.2 5.8 3 3"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 6.5h15M9.5 6.5V5a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v1.5"/><path d="M6.5 6.5 7.4 19a1.5 1.5 0 0 0 1.5 1.4h6.2a1.5 1.5 0 0 0 1.5-1.4l.9-12.5M10.5 10v6.5M13.5 10v6.5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6 18 18M18 6 6 18"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="M9.5 5.5 16 12l-6.5 6.5"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24"><path d="M14.5 8V6a1.5 1.5 0 0 0-1.5-1.5H6A1.5 1.5 0 0 0 4.5 6v12A1.5 1.5 0 0 0 6 19.5h7a1.5 1.5 0 0 0 1.5-1.5v-2"/><path d="M9.5 12h11m0 0-3-3m3 3-3 3"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="1.8"/><path d="M15.5 8.5v-2a1.5 1.5 0 0 0-1.5-1.5H6A1.5 1.5 0 0 0 4.5 6.5V14a1.5 1.5 0 0 0 1.5 1.5h2"/></symbol>
  <symbol id="i-folderup" viewBox="0 0 24 24"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4.1a1.5 1.5 0 0 1 1.2.6l.9 1.2a1.5 1.5 0 0 0 1.2.6h6.6A1.5 1.5 0 0 1 20 9.9v7.6a1.5 1.5 0 0 1-1.5 1.5h-14A1.5 1.5 0 0 1 3 17.5z"/><path d="M11.5 16v-4.5M9.5 13.2l2-2 2 2"/></symbol>
  <symbol id="i-sort" viewBox="0 0 24 24"><path d="M7 4.5v15m0 0L4 16.5M7 19.5l3-3M17 19.5v-15m0 0-3 3m3-3 3 3"/></symbol>
  <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M3.5 13.5h4l1.5 3h6l1.5-3h4"/><path d="M5.6 5.6h12.8a1.5 1.5 0 0 1 1.4 1l1.7 5.1v6.8a1.5 1.5 0 0 1-1.5 1.5H4.5A1.5 1.5 0 0 1 3 18.5v-6.8l1.7-5.1a1.5 1.5 0 0 1 1.4-1z"/></symbol>
</svg>

<!-- ============ LOGIN ============ -->
<div id="login" class="login">
  <form class="login-card" id="loginForm">
    <div class="login-mark"><svg><use href="#i-upload"/></svg></div>
    <h1>SuvShare</h1>
    <p class="login-sub">Sign in to manage your files</p>
    <label class="field">
      <span>Password</span>
      <input type="password" id="loginPassword" autocomplete="current-password" required autofocus>
    </label>
    <p class="login-error" id="loginError" hidden></p>
    <button type="submit" class="btn btn-primary btn-full" id="loginBtn">Sign in</button>
  </form>
  <p class="login-foot">Download links stay public &middot; uploads need this password</p>
</div>

<!-- ============ APP ============ -->
<div id="app" class="app" hidden>

  <header class="topbar">
    <button class="icon-btn only-mobile" id="menuBtn" aria-label="Menu"><svg><use href="#i-menu"/></svg></button>
    <a class="brand" href="/">
      <span class="brand-mark"><svg><use href="#i-upload"/></svg></span>
      <span class="brand-name">SuvShare</span>
    </a>
    <div class="searchbar">
      <svg class="searchbar-icon"><use href="#i-search"/></svg>
      <input type="search" id="search" placeholder="Search files" autocomplete="off" spellcheck="false">
      <kbd class="only-desktop">/</kbd>
    </div>
    <button class="btn btn-primary only-desktop" id="uploadBtn"><svg><use href="#i-upload"/></svg>Upload</button>
    <button class="icon-btn" id="logoutBtn" aria-label="Sign out" title="Sign out"><svg><use href="#i-logout"/></svg></button>
  </header>

  <div class="layout">
    <div class="scrim" id="scrim"></div>

    <aside class="sidebar" id="sidebar">
      <nav class="nav">
        <button class="nav-item is-active" data-view="all"><svg><use href="#i-inbox"/></svg>All files<span class="nav-count" data-count="all"></span></button>
        <button class="nav-item" data-view="folder"><svg><use href="#i-folder"/></svg>Folders<span class="nav-count" data-count="folder"></span></button>
        <button class="nav-item" data-view="image"><svg><use href="#i-image"/></svg>Images<span class="nav-count" data-count="image"></span></button>
        <button class="nav-item" data-view="video"><svg><use href="#i-video"/></svg>Video<span class="nav-count" data-count="video"></span></button>
        <button class="nav-item" data-view="audio"><svg><use href="#i-audio"/></svg>Audio<span class="nav-count" data-count="audio"></span></button>
        <button class="nav-item" data-view="document"><svg><use href="#i-doc"/></svg>Documents<span class="nav-count" data-count="document"></span></button>
        <button class="nav-item" data-view="archive"><svg><use href="#i-archive"/></svg>Archives<span class="nav-count" data-count="archive"></span></button>
        <div class="nav-sep"></div>
        <button class="nav-item" data-view="links"><svg><use href="#i-link"/></svg>Short links<span class="nav-count" data-count="links"></span></button>
      </nav>

      <div class="storage">
        <div class="storage-head">
          <span>Storage</span>
          <span class="storage-pct" id="storagePct">0%</span>
        </div>
        <div class="meter"><div class="meter-fill" id="storageBar"></div></div>
        <p class="storage-text" id="storageText">&mdash;</p>
      </div>
    </aside>

    <main class="main" id="main">
      <!-- FILES -->
      <section id="filesView">
        <div class="toolbar">
          <div class="toolbar-title">
            <h2 id="viewTitle">All files</h2>
            <span class="muted" id="viewCount"></span>
          </div>
          <div class="toolbar-actions">
            <div class="seg" role="group" aria-label="Sort">
              <button class="seg-btn" id="sortBtn"><svg><use href="#i-sort"/></svg><span id="sortLabel">Newest</span></button>
            </div>
            <div class="seg" role="group" aria-label="View">
              <button class="seg-btn is-on" id="listViewBtn" aria-label="List view"><svg><use href="#i-list"/></svg></button>
              <button class="seg-btn" id="gridViewBtn" aria-label="Grid view"><svg><use href="#i-grid"/></svg></button>
            </div>
          </div>
        </div>

        <div class="selbar" id="selbar" hidden>
          <button class="icon-btn" id="selClear" aria-label="Clear selection"><svg><use href="#i-x"/></svg></button>
          <strong id="selCount">0 selected</strong>
          <div class="spacer"></div>
          <button class="btn btn-ghost" id="selCopy"><svg><use href="#i-link"/></svg><span class="only-desktop">Copy links</span></button>
          <button class="btn btn-ghost" id="selDownload"><svg><use href="#i-download"/></svg><span class="only-desktop">Download</span></button>
          <button class="btn btn-ghost btn-danger" id="selDelete"><svg><use href="#i-trash"/></svg><span class="only-desktop">Delete</span></button>
        </div>

        <div id="fileList" class="list"></div>

        <div class="empty" id="empty" hidden>
          <svg><use href="#i-inbox"/></svg>
          <h3 id="emptyTitle">No files yet</h3>
          <p id="emptyText">Drag files anywhere on this page, or use the Upload button.</p>
        </div>
      </section>

      <!-- LINKS -->
      <section id="linksView" hidden>
        <div class="toolbar">
          <div class="toolbar-title"><h2>Short links</h2><span class="muted" id="linkCount"></span></div>
        </div>
        <form class="linkform" id="linkForm">
          <input type="url" id="linkUrl" placeholder="https://example.com/very/long/address" required>
          <input type="text" id="linkAlias" placeholder="suvo… (optional)" pattern="suvo.*" title="Custom alias must start with suvo">
          <button class="btn btn-primary" type="submit"><svg><use href="#i-plus"/></svg>Create</button>
        </form>
        <div id="linkList" class="list"></div>
      </section>
    </main>
  </div>

  <button class="fab only-mobile" id="fabUpload" aria-label="Upload"><svg><use href="#i-plus"/></svg></button>

  <!-- upload dock -->
  <div class="dock" id="dock" hidden>
    <div class="dock-head">
      <strong id="dockTitle">Uploading</strong>
      <div class="spacer"></div>
      <button class="icon-btn" id="dockToggle" aria-label="Collapse"><svg><use href="#i-left"/></svg></button>
      <button class="icon-btn" id="dockClose" aria-label="Close"><svg><use href="#i-x"/></svg></button>
    </div>
    <div class="dock-body" id="dockBody"></div>
  </div>
</div>

<!-- overlays -->
<div class="dropzone" id="dropzone"><div class="dropzone-inner"><svg><use href="#i-upload"/></svg><p>Drop to upload</p></div></div>

<div class="modal" id="preview" hidden>
  <div class="modal-bar">
    <span class="modal-name" id="previewName"></span>
    <div class="spacer"></div>
    <a class="icon-btn" id="previewDownload" aria-label="Download"><svg><use href="#i-download"/></svg></a>
    <button class="icon-btn" id="previewClose" aria-label="Close"><svg><use href="#i-x"/></svg></button>
  </div>
  <button class="modal-nav prev" id="previewPrev" aria-label="Previous"><svg><use href="#i-left"/></svg></button>
  <div class="modal-stage" id="previewStage"></div>
  <button class="modal-nav next" id="previewNext" aria-label="Next"><svg><use href="#i-right"/></svg></button>
</div>

<div class="sheet" id="dialog" hidden>
  <form class="sheet-card" id="dialogForm">
    <h3 id="dialogTitle">Rename</h3>
    <p id="dialogText" class="muted"></p>
    <input type="text" id="dialogInput">
    <div class="sheet-actions">
      <button type="button" class="btn btn-ghost" id="dialogCancel">Cancel</button>
      <button type="submit" class="btn btn-primary" id="dialogOk">Save</button>
    </div>
  </form>
</div>

<div class="menu" id="ctxMenu" hidden></div>
<div class="toasts" id="toasts"></div>

<input type="file" id="fileInput" multiple hidden>
<input type="file" id="folderInput" webkitdirectory directory multiple hidden>

<script src="/app.js"></script>
</body>
</html>
